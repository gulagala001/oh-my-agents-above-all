name: Build packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: omaa-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check public Git inventory
        run: node scripts/public-files.mjs
      - uses: pnpm/action-setup@v6
        with:
          version: '11.28.5'
      - name: Install the exact SDK and frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Git review scopes and write boundaries
        run: node --test test/git-review.test.mjs test/git-review-state.test.mjs
      - name: Check update service and current release contracts
        run: node --test test/update-service-lifecycle.test.mjs test/updates.test.mjs test/updates-current-release.test.mjs
      - name: Check packaged search scopes and provider lifecycle
        run: node --test test/search-compat.test.mjs test/zcode-session-tool-scope.test.mjs
      - name: Build the current host target
        run: pnpm build
      - name: Pack and inspect the current host target
        run: |
          mkdir -p dist/ci
          npm pack --pack-destination dist/ci
          node scripts/public-files.mjs --archive dist/ci/*.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: omaa-current-host-package
          path: dist/ci/*.tgz
          if-no-files-found: error
