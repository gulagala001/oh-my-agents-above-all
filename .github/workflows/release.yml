name: Check release inventory
on:
  push:
    tags: ['v*.omaa.*', 'v*-omaa.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check tagged public files and version identity
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node scripts/public-files.mjs
          if [ "$REF_TYPE" = tag ]; then
            test "$REF_NAME" = "v$(node -p 'require("./package.json").version')"
          fi
